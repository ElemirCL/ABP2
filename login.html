<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <title>AestheticWallet</title>
</head>

<body>
  <!-- Contenedor  -->
  <div class="container text-center rounded-top rounded-bottom pb-5 shadow" id="contenedor">
    <!-- HERO -->
    <section class="container-fluid" id="heroSection">
      <h1 class="display-5 text-light">Alket Wallet</h1>
      <p class="lead text-light">Inicia sesión con tus datos personales</p>
    </section>
    <!-- Formulario inicio de sesión -->
     <div class="card-body">
      <div class="row justify-content-center">
        <div class="col-12 col-md-6">
      <div class="form-group justify-content-center">
        <label for="correo">Correo Electrónico</label>
        <input type="email" id="correo" placeholder="correo@aesthetic.cl" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="contraseña">Contraseña</label>
        <input type="password" id="contraseña" class="form-control">
      </div>
      <button id="btnSesion" class="btn btn-success btn-block">Ingresar</button>
      <div id="infoAcceso" class="" style="display: none;">
        <p class="alert m-0 p-0 mt-2 alert-danger" id="leyenda">Credenciales erróneas</p>
    </div>
        </div>
      </div>
     </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
    integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"
    integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+"
    crossorigin="anonymous"></script>
  <script src="assets/javascript/login.js"></script>
</body>
</html>
