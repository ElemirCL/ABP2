<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <title>AestheticWallet - Deposito</title>
</head>

<body>
  <div class="container rounded-top pb-1 shadow">
  <div class="row">
      <div class="card-body">
        <div class="row col-12">
          <div class="col-12 text-center pb-4">
            <h2>Depositar</h2>
          </div>
          <!-- Formulario Deposito -->
          <form class="form-group col-12">
            <div class="text-center">
              <label for="deposito">Monto a depositar:</label>
              <input type="number" class="form-control text-center" id="deposito" placeholder="Ingresar valor">
            </div>
          </form>
          <!-- Botones Depositar &  Volver a Menú-->
          <div class="col text-center">
            <button type="submit" class="btn btn-primary" id="btnDepositar">Realizar depósito</button>
            <a href="menu.html" class="btn btn-secondary ">Volver al Menú Principal</a>
          </div>
          <!-- Sección alerta deposito -->
          <div class="col-12 text-center" id="alertaDeposito">
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
      integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
      crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"
      integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+"
      crossorigin="anonymous"></script>
    <script src="assets/javascript/deposit.js"></script>
</body>

</html>
