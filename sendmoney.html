<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <title>AestheticWallet - Enviar dinero</title>
</head>

<body>

  <div class="container text-center rounded-top pb-5 mb-0 shadow" id="hero">
    <h1 class="display-5 text-light">Aesthetic Wallet</h1>
    <p class="lead text-light">Enviar dinero</p>
    <!-- Formulario Envío de dinero -->
    <form>
      <div class="form-row">
        <div class="col-xl-3 col-md-6 mb-3">
          <label for="inputNombre">Nombre</label>
          <input type="text" class="form-control" id="inputNombre">
        </div>
        <div class="col-xl-3 col-md-6 mb-3">
          <label for="inputApellido">Apellido</label>
          <input type="text" class="form-control" id="inputApellido">
        </div>
        <div class="col-xl-3 col-md-6 mb-3">
          <label for="inputBanco">Banco</label>
          <input type="text" class="form-control" id="inputBanco">
        </div>
        <div class="col-xl-3 col-md-6 mb-3">
          <label for="inputMonto">Monto</label>
          <input type="number" class="form-control" id="inputMonto">
        </div>
      </div>
      <!-- Botones Depositar - Volver a Menú - Reset -Agregar Contacto -->
      <div class="container mt-0">
        <div class="row justify-content-center">
          <button class="btn btn-success   col-md-6 col-lg-3 btn-alerta" type="submit" id="btnEnviarDinero">Enviar
            dínero</button>
          <button class="btn btn-primary   col-md-6 col-lg-3 btn-alerta" id="btnAgregarContacto">Agregar
            Contacto</button>
          <a href="menu.html" class="btn btn-secondary   col-md-6 col-lg-3">Volver a menú</a>
          <input class="btn btn-info   col-md-6 col-lg-3" type="reset" id="inputReset" value="💭" data-toggle="modal"
            data-target="#exampleModal">
        </div>
      </div>
    </form>
    <!-- Sección alerta deposito -->
    <div class="text-center" id="alertaDeposito">
    </div>
  </div>

  <!-- Lista Contactos -->
  <div class="container text-center  rounded-bottom pb-5 mt-0 shadow">
    <h5 style="color:white">Mis Contactos</h5>
    <ul class="list-group" id="listaContactos">
    </ul>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel">Reset de formulario</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          Recuerda no compartir tus credenciales con nadie, no nos hacemos responsables si tu dinero termine en mi
          cuenta bancaria
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
    integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"
    integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+"
    crossorigin="anonymous"></script>
  <script src="assets/javascript/sendmoney.js"></script>
</body>

</html>
